server {
    listen       3013;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Assets com hash no nome: cache longo e imutavel
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
        try_files  $uri =404;
    }

    # index.html nunca em cache (aponta para os assets versionados)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback: qualquer rota do React Router cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
