version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: ankane/pgvector:latest
    container_name: manga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manga_db}
      POSTGRES_USER: ${DB_USER:-manga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manga123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./storage/postgres/db:/var/lib/postgresql/data
      - ./storage/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-manga_user} -d ${DB_NAME:-manga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-network

  # pgAdmin (opcional, para gerenciar o banco visualmente)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: manga-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@manga.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin123}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    networks:
      - manga-network
    depends_on:
      - postgres

  # Backend API + MCP Server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: manga-backend
    restart: unless-stopped
    environment:
      # Application
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PORT: 3010
      # Database
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_NAME: ${DB_NAME:-manga_db}
      DB_USER: ${DB_USER:-manga_user}
      DB_PASSWORD: ${DB_PASSWORD:-manga123}
      # Storage paths
      IMAGES_PATH: ${IMAGES_PATH:-/app/storage/images}
      STORAGE_PATH: ${STORAGE_PATH:-/app/storage}
      TEMP_PATH: ${TEMP_PATH:-/app/storage/temp}
      # AI APIs
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GOOGLE_SEARCH_API_KEY: ${GOOGLE_SEARCH_API_KEY}
      GOOGLE_SEARCH_ENGINE_ID: ${GOOGLE_SEARCH_ENGINE_ID}
      # MCP
      MCP_SERVER_NAME: ${MCP_SERVER_NAME:-manga-agent-mcp}
      MCP_SERVER_VERSION: ${MCP_SERVER_VERSION:-1.0.0}
    ports:
      - "3010:3010"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./backend/src:/app/src
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      # Node modules (evita conflitos)
      - backend-node-modules:/app/node_modules
      # Logs
      - ./backend/logs:/app/logs
      # Storage compartilhado (imagens, etc.)
      - ./storage:/app/storage
    networks:
      - manga-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run dev

  # Frontend React (V1)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        VITE_API_URL: http://localhost:3010
    container_name: manga-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:3010
    ports:
      - "3012:3012"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./frontend/src:/app/src:ro
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      # Node modules (evita conflitos)
      - frontend-node-modules:/app/node_modules
      # Storage compartilhado (imagens, etc.)
      - ./storage:/app/storage:ro
    networks:
      - manga-network
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

  # Backend API V2 (NestJS + Prisma)
  backend-v2:
    build:
      context: ./backend-v2
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: manga-backend-v2
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3011
      DATABASE_URL: postgresql://${DB_USER:-manga_user}:${DB_PASSWORD:-manga123}@postgres:5432/${DB_NAME:-manga_db}
      IMAGES_PATH: /app/storage/images
    ports:
      - "3011:3011"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./backend-v2/src:/app/src
      - ./backend-v2/prisma:/app/prisma
      - ./backend-v2/package.json:/app/package.json:ro
      - ./backend-v2/tsconfig.json:/app/tsconfig.json:ro
      - ./backend-v2/nest-cli.json:/app/nest-cli.json:ro
      # Node modules (evita conflitos)
      - backend-v2-node-modules:/app/node_modules
      # Storage compartilhado (imagens, etc.)
      - ./storage:/app/storage
    networks:
      - manga-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

  # Frontend V2 (Next.js + shadcn/ui)
  frontend-v2:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        NEXT_PUBLIC_API_URL: http://localhost:3011/api
    container_name: manga-frontend-v2
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_API_URL: http://localhost:3011/api
      PORT: 3013
    ports:
      - "3013:3013"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./frontend-v2/src:/app/src
      - ./frontend-v2/public:/app/public:ro
      - ./frontend-v2/package.json:/app/package.json:ro
      - ./frontend-v2/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend-v2/next.config.ts:/app/next.config.ts:ro
      - ./frontend-v2/tailwind.config.ts:/app/tailwind.config.ts:ro
      - ./frontend-v2/postcss.config.mjs:/app/postcss.config.mjs:ro
      - ./frontend-v2/components.json:/app/components.json:ro
      # Node modules (evita conflitos)
      - frontend-v2-node-modules:/app/node_modules
      # Next.js cache
      - frontend-v2-next:/app/.next
      # Storage compartilhado (imagens, etc.)
      - ./storage:/app/storage:ro
    networks:
      - manga-network
    depends_on:
      - backend-v2
    command: npm run dev

networks:
  manga-network:
    driver: bridge

volumes:
  backend-node-modules:
  frontend-node-modules:
  backend-v2-node-modules:
  frontend-v2-node-modules:
  frontend-v2-next:
  pgadmin-data:
