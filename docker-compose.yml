services:
  # PostgreSQL Database
  postgres:
    image: ankane/pgvector:latest
    container_name: manga-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-manga_db}
      POSTGRES_USER: ${DB_USER:-manga_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-manga123}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - ./storage/postgres/db:/var/lib/postgresql/data
      #- ./storage/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-manga_user} -d ${DB_NAME:-manga_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - manga-network

  # Backend API (NestJS + Prisma)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
    container_name: manga-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3011
      DATABASE_URL: postgresql://${DB_USER:-manga_user}:${DB_PASSWORD:-manga123}@postgres:5432/${DB_NAME:-manga_db}
      IMAGES_PATH: /app/storage/images
    ports:
      - "3011:3011"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/package.json:/app/package.json:ro
      - ./backend/tsconfig.json:/app/tsconfig.json:ro
      - ./backend/nest-cli.json:/app/nest-cli.json:ro
      # Node modules (evita conflitos)
      - backend-node-modules:/app/node_modules
      # Storage compartilhado (imagens servidas em /images)
      - ./storage:/app/storage
    networks:
      - manga-network
    depends_on:
      postgres:
        condition: service_healthy
    command: npm run start:dev

  # Frontend (React + Vite + React Router + shadcn/ui)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-development}
        VITE_API_URL: http://localhost:3011/api
    container_name: manga-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      VITE_API_URL: http://localhost:3011/api
      PORT: 3013
    ports:
      - "3013:3013"
    volumes:
      # Hot reload - mapeia src/ para desenvolvimento
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public:ro
      - ./frontend/index.html:/app/index.html:ro
      - ./frontend/package.json:/app/package.json:ro
      - ./frontend/vite.config.ts:/app/vite.config.ts:ro
      - ./frontend/tsconfig.json:/app/tsconfig.json:ro
      - ./frontend/tsconfig.app.json:/app/tsconfig.app.json:ro
      - ./frontend/tsconfig.node.json:/app/tsconfig.node.json:ro
      - ./frontend/components.json:/app/components.json:ro
      # Node modules (evita conflitos)
      - frontend-node-modules:/app/node_modules
      # NAO montar ./storage aqui: o watcher do Vite varre a raiz do projeto,
      # e as dezenas de milhares de imagens fazem ele disparar full-reload no meio
      # da navegacao (alem de deixar a primeira carga de cada rota ~13s).
      # O front nunca le storage/ — as capas vem do backend em :3011/images/.
    networks:
      - manga-network
    depends_on:
      - backend
    command: npm run dev -- --host --port 3013

networks:
  manga-network:
    driver: bridge

volumes:
  backend-node-modules:
  frontend-node-modules:
